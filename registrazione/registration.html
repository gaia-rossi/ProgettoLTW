<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- IMPORT CSS/BOOTSTRAP -->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" href="./registration.css"/>

    <!-- IMPORT FILE JAVASCRIPT PER VALIDAZIONE -->
    <script src="./valid-registration.js" type="application/javascript"></script>
    
    <title>Sign-up page</title>
</head>
<body class="text-center">

        <div name="div_form" class="form-div">

            <form name="registration_form" action="registration.php" method="POST"
                onsubmit="return check_form();">

                <!-- TITOLO ED ICONA -->
                <div class="form-group mb-xxl-5">
                    <img src = "stadium.png" alt="Icona" class="format-icon"/>
                    <h1 style="clear: left;">WEvent</h1>
                </div>

                <!-- INSERIMENTO NOME E COGNOME -->
                <div style="text-align: left;">
                    <img src = "person-vcard-fill.svg" alt="NomeCognome" class="format-white"/>
                    <label for="name-input">Nome e Cognome</label>
                </div>

                <div class="form-row mb-1 myname" style="text-align: left;" name="div_name">
                    <div class="col col1">
                        <input type="text" name="insert_name" class="form-control" placeholder="Nome" id="name-input" autofocus>
                    </div>
                    <div class="col col2">
                        <input type="text" name="insert_lastname" class="form-control" placeholder="Cognome" id="lastname-input">
                    </div>
                </div>

                <!-- INSERIMENTO EMAIL -->
                <div class="form-group mb-1" style="text-align: left;" name="div_mail">
                    <img src = "person-bounding-box.svg" alt="Email" class="format-white"/>
                    <label for="mail-input">Indirizzo Email</label>
                    <input name="insert_email" type="email" class="form-control" id="mail-input"
                        placeholder="Es: abc@def.xyz">
                </div>

                <!-- INSERIMENTO PASSWORD -->
                <div class="form-group mb-2" style="text-align: left;">
                    <img src = "check2.svg" alt="Password" class="format-white"/>
                    <label for="pswd-input">Password</label>
                    <input name="insert_pswrd" type="password" class="form-control" id="pswd-input" 
                        placeholder="*****">
                </div>

                <div class="form-group mb-2" style="text-align: left;">
                    <img src = "check2-all.svg" alt="Password2" class="format-white"/>
                    <label for="pswd-confirm">Conferma la password</label>
                    <input name="check_pswrd" type="password" class="form-control" id="pswd-confirm" 
                        placeholder="*****">
                </div>

                <!-- INSERIMENTO REGIONE -->
                <div class="form-group mb-3" style="text-align: left;">
                    <img src = "house-door.svg" alt="Città" class="format-white"/>
                    <label for="city-input">Regione di residenza</label>
                    <select name="insert_city" class="form-select form-select-sm" aria-label=".form-select-sm example" id="city-input">
                        <option value="" selected>---</option>
                        <option value = "Valle D'Aosta"> Valle d’Aosta </option>
                        <option value = "Piemonte"> Piemonte </option>
                        <option value = "Liguria"> Liguria </option>
                        <option value = "Lombardia"> Lombardia </option>
                        <option value = "Veneto"> Veneto </option>
                        <option value = "Trentino"> Trentino Alto Adige </option>
                        <option value = "Friuli"> Friuli Venezia-Giulia </option>
                        <option value = "Emilia"> Emilia-Romagna </option>
                        <option value = "Toscana"> Toscana </option>
                        <option value = "Marche"> Marche </option>
                        <option value = "Umbria"> Umbria </option>
                        <option value = "Lazio"> Lazio </option>
                        <option value = "Abruzzo"> Abruzzo </option>
                        <option value = "Molise"> Molise </option>
                        <option value = "Campania"> Campania </option>
                        <option value = "Basilicata"> Basilicata </option>
                        <option value = "Puglia"> Puglia </option>
                        <option value = "Calabria"> Calabria </option>
                        <option value = "Sicilia"> Sicilia </option>
                        <option value = "Sardegna"> Sardegna </option>
                    </select>
                </div>

                <!-- CHECKBOX RICORDAMI -->
                <div class="form-check mb-3" style="text-align: left;">
                    <input type="checkbox" class="form-check-input" id="rmbr">
                    <label class="form-check-label" for="rmbr">Ricordami</label>
                </div>

                <!-- BOTTONI PER INVIO FORM E RESET FORM -->
                <div class="form-group mb-3">
                    <button type="submit" class="btn btn-outline-light"
                        value="Invia">Registrati</button>
                    <button type="reset" class="btn btn-outline-light"
                        value="Reset">Reset</button>
                </div>
                
                <!-- REGISTRAZIONE -->
                <div class="form-group mb-1">
                    Sei già registrato?
                    <a href="../login/login.html">Effettua il login!</a>
                </div>

            </form>

        </div>

</body>
</html>
