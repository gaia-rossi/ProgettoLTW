<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- IMPORT CSS/BOOTSTRAP -->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" href="./login.css"/>

    <!-- IMPORT FILE JAVASCRIPT PER VALIDAZIONE -->
    <script src="./valid-login.js" type="application/javascript"></script>
    
    <title>Login page</title>
</head>
<body class="text-center">

        <div name="div_form" class="form-div">

            <form name="login_form" action="login.php" method="POST"
                onsubmit="return check_box();">

                <!-- TITOLO ED ICONA -->
                <div class="form-group mb-xxl-5">
                    <img src = "stadium.png" alt="Icona" class="format-icon"/>
                    <h1 style="clear: left;">WEvent</h1>
                </div>

                <!-- INSERIMENTO EMAIL -->
                <div class="form-group mb-1" style="text-align: left;" name="div_mail">
                    <img src = "person-bounding-box.svg" alt="Email" class="format-white"/>
                    <label for="mail-input">Indirizzo Email</label>
                    <input name="insert_email" type="email" class="form-control" id="mail-input"
                        placeholder="Es: abc@def.xyz" autofocus>
                </div>

                <!-- INSERIMENTO PASSWORD -->
                <div class="form-group mb-3" style="text-align: left;">
                    <img src = "check2-all.svg" alt="Password" class="format-white"/>
                    <label for="pswd-input">Password</label>
                    <input name="insert_pswrd" type="password" class="form-control" id="pswd-input" 
                        placeholder="*****">
                </div>

                <!-- CHECKBOX RICORDAMI -->
                <div class="form-check mb-3" style="text-align: left;">
                    <input type="checkbox" class="form-check-input" id="rmbr">
                    <label class="form-check-label" for="rmbr">Ricordami</label>
                </div>

                <!-- BOTTONI PER INVIO FORM E RESET FORM -->
                <div class="form-group mb-3">
                    <button type="submit" class="btn btn-outline-light"
                        value="Invia">Login</button>
                    <button type="reset" class="btn btn-outline-light"
                        value="Reset">Reset</button>
                </div>
                
                <!-- REGISTRAZIONE -->
                <div class="form-group mb-1">
                    Non hai ancora creato un account?
                    <a href="../registrazione/registration.html">Registrati!</a>
                </div>

            </form>

        </div>

</body>
</html>
