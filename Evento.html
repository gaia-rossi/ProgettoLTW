<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./bootstrap/css/bootstrap.css" />
    <script defer src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="jquery-3.6.0.js"></script>
    <link rel="stylesheet" href="./pagin.css">

    <title>Evento</title>

    <!-- IMPORT FILE JAVASCRIPT -->
    <!--<script src="./EventoFunzioni.js" type="application/javascript"></script>-->
    <style>
        .card-b {
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="card-group">
            <!-- HEADER DELLA PAGINA -->
            <div class="card text-bg-dark card-b">
                <img src="./icons/Concerti.jpg" class="card-img" alt="...">
                <div class="card-img-overlay">
                <h5 class="card-title">Card title</h5>
                <p class="card-text">This is a wider card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.</p>
                <p class="card-text"><small>Last updated 3 mins ago</small></p>
                </div>
            </div>

            <!-- CARD PER PUBBLICARE CONTENUTI-->
            <div class="card card-b">
                <div class="card-header">
                Partecipa alla conversazione!
                </div>
                <div class="card-body">
                <textarea name="infoEvento" id="infoEvento" class="form-control myinputs" size="140" maxlength="140" placeholder="..."></textarea>
                <a href="#" class="btn btn-primary">Go somewhere</a>
                </div>
                <div class="card-footer text-muted">
                    2 days ago
                </div>
            </div>

        </div>
        
    </div>
    
</body>
</html>
