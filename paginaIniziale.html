      <h3>Eventi a cui sei iscritto ...</h3>  
      <p>inserire eventi</p>

      <h3 id="elencoEventi">... ed eventi che ti potrebbero piacere</h3>
      <div id="caricaEventi">inserire eventi</div>
      
      <script>
        var list = document.getElementById("elencoEventi");
        list.onclick = caricaRisorsa;

        function caricaRisorsa(e){
            var httpRequest = new XMLHttpRequest();
            httpRequest.onreadystatechange = gestisciResponse;
            httpRequest.open("GET", "listaEventi.php", true);
            httpRequest.send();
        }

        function gestisciResponse(e){
            if(e.target.readyState == 4 && e.target.status == 200){
                document.getElementById("caricaEventi").innerHTML = e.target.responseText;
            }
        }  
      </script>
